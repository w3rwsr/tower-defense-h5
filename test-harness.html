<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html,body { margin:0; background:#333; }
  #f { border:0; display:block; }
</style>
</head>
<body>
<iframe id="f" src="index.html"></iframe>
<script>
  const w = parseInt(location.hash.slice(1).split('x')[0] || '390', 10);
  const h = parseInt(location.hash.slice(1).split('x')[1] || '844', 10);
  document.getElementById('f').style.width = w + 'px';
  document.getElementById('f').style.height = h + 'px';
  document.title = w + 'x' + h;
</script>
</body>
</html>

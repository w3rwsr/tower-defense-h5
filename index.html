<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>卡通塔防 H5（Phaser 3）</title>
  <link rel="stylesheet" href="style.css?v=20261017g" />
  <!-- Phaser 3（本地引用，离线可运行；如需 CDN 可换成 https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js）。
       全部脚本 defer：浏览器先渲染加载提示层，再并行下载、按序执行，消除手机端白屏 -->
  <script defer src="vendor/phaser.min.js?v=20260920h"></script>
</head>
<body>
  <!-- 启动加载提示层（#app 之外，不参与视觉横屏旋转；Phaser 就绪后由 BootScene 移除） -->
  <div id="boot-loading">
    <div class="boot-box">
      <div class="boot-flame">🔥</div>
      <div class="boot-text">游戏加载中…</div>
      <div class="boot-bar"><i id="boot-bar-fill"></i></div>
      <div class="boot-dots"><i></i><i></i><i></i></div>
      <div id="boot-loading-tip"></div>
      <button id="boot-retry" type="button" style="display:none">⟳ 重新加载</button>
    </div>
  </div>
  <script>
    /* 启动守护（同步内联，先于所有 defer 脚本注册）：
       1. 脚本/样式加载失败 → 置失败标记，由文末进度脚本统一走自动重试；
       2. 8 秒仍未就绪 → 提示可能网络较慢；BootScene 就绪后置 __tdBootOK 并移除提示层 */
    (function () {
      window.__tdBootOK = false;
      window.__tdBootFailed = false;
      window.addEventListener('error', function (e) {
        if (window.__tdBootOK || window.__tdBootFailed) return;
        var t = e && e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          window.__tdBootFailed = true;
          if (window.__tdBootOnFail) window.__tdBootOnFail();
        }
      }, true);
      setTimeout(function () {
        if (!window.__tdBootOK && !window.__tdBootFailed) {
          var el = document.getElementById('boot-loading-tip');
          if (el) el.textContent = '加载时间较长，请耐心等待；若长时间无响应请刷新';
        }
      }, 8000);
    })();
  </script>
  <div id="app">
    <!-- Phaser 画布容器 -->
    <div id="game-container"></div>

    <!-- 顶部 HUD：金币 / 生命 / 波次 + 控制按钮 -->
    <div id="hud-top">
      <div class="stats">
        <span class="chip chip-level">🎯 <b id="hud-level">第 1 关</b></span>
        <span class="chip chip-gold">🪙 <b id="hud-gold">0</b></span>
        <span class="chip chip-lives">❤️ <b id="hud-lives">0</b></span>
        <span class="chip chip-wave">🌊 <b id="hud-wave">0/0</b></span>
      </div>
      <div class="controls">
        <button id="btn-speed" class="btn btn-ctrl" type="button">1x</button>
        <button id="btn-pause" class="btn btn-ctrl" type="button">⏸ 暂停</button>
        <!-- 移动端专用：暂停 + 倍速合并菜单（电脑端由 CSS 隐藏，仍使用上面两个按钮） -->
        <div id="mobile-menu">
          <button id="btn-mobile-menu" class="btn btn-ctrl" type="button" aria-label="游戏菜单">⚙</button>
          <div id="mobile-menu-panel">
            <button id="m-menu-pause" class="m-item" type="button">⏸ 暂停</button>
            <div class="m-speed-row">
              <button id="m-menu-speed1" class="m-item" type="button">1x</button>
              <button id="m-menu-speed2" class="m-item" type="button">2x</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部 HUD：波次控制（防御塔商店已改为点击地图火力点弹出选塔框） -->
    <div id="hud-bottom">
      <div id="wave-box">
        <span id="wave-info"></span>
        <button id="btn-wave" class="btn btn-wave" type="button"></button>
      </div>
    </div>

    <!-- 暂停遮罩：继续（主操作）在上，返回选关（次操作）在下，进度不保存 -->
    <div id="overlay-pause" class="overlay hidden">
      <div class="overlay-card">
        <h2>⏸ 已暂停</h2>
        <button id="btn-resume" class="btn btn-resume" type="button">▶ 继续游戏</button>
        <button id="btn-pause-levels" class="btn btn-to-levels btn-pause-levels" type="button">🗺 返回选关</button>
      </div>
    </div>

    <!-- 结算遮罩 -->
    <div id="overlay-end" class="overlay hidden">
      <div class="overlay-card">
        <h1 id="end-title">胜利！</h1>
        <p id="end-desc"></p>
        <div class="end-btns">
          <button id="btn-restart" class="btn btn-restart" type="button">🔄 再来一局</button>
          <button id="btn-to-levels" class="btn btn-to-levels" type="button">🗺 返回选关</button>
        </div>
      </div>
    </div>

    <!-- 竖屏旋转提示遮罩：强制横屏模式，竖屏下覆盖整屏提示用户旋转 -->
    <div id="orientation-hint">
      <div class="rotate-inner">
        <div class="rotate-icon">📱↻</div>
        <h2>请旋转设备至横屏</h2>
        <p>本游戏仅支持横屏模式，请将手机横放后继续游玩</p>
      </div>
    </div>

  </div>

  <!-- 方向检测诊断面板：放在 #app 外部，不跟随视觉横屏旋转，
       任何握持角度下面板始终横向、完整可读（真机排查用，#dbg 时显示） -->
  <div id="dbg-panel" hidden>方向诊断：等待检测…</div>

  <!-- ===== 脚本按依赖顺序加载（全部 defer：按文档顺序执行，下载并行） =====
       FireBurnData.js（~600KB 内嵌燃烧视频）不在此同步加载——由 main.js 在
       Phaser 启动前后台动态注入，选关页先行进入，视频数据就绪后自动挂接 -->
  <script defer src="js/config.js?v=20261019e"></script>
  <!-- 4 级塔配置（唯一来源根目录 TowerConfig.json；file:// 无法 fetch JSON，
       故加载内嵌副本并注入 TD_CONFIG：maxLevel/lv4Cost/waveGate + cfg.lv4） -->
  <script defer src="js/TowerConfigData.js?v=20261018b"></script>
  <script defer src="js/storage.js?v=20261018j"></script>
  <!-- 媒体加载统一调度（串行队列 + 进度条 + 10s 超时跳过 + Cache API 缓存）：
       必须早于各视频模块执行，供其按需排进加载队列 -->
  <script defer src="js/MediaLoader.js?v=20261018b"></script>
  <!-- 开发调试工具：仅 URL 带 #dbg 时激活（全内容解锁 + 应用内浏览器），无 #dbg 的正式环境脚本立即退出，不创建 DOM、不写任何存储 -->
  <script defer src="js/debugTools.js?v=20260921r"></script>
  <script defer src="js/attackModule.js?v=20261017c"></script>
  <script defer src="js/objects/Enemy.js?v=20261019d"></script>
  <!-- 第 8 关专属实体（水晶史莱姆/自爆泥怪/熔岩巨兽/风眼控制器），依赖 Enemy 基类 -->
  <script defer src="js/objects/Level8Enemies.js?v=20261019e"></script>
  <script defer src="js/objects/Projectile.js?v=20261015c"></script>
  <!-- 4 级塔异常状态管理器（塔侧）：依赖 Projectile 做命中钩子，须在其后加载 -->
  <script defer src="js/objects/StatusEffects.js?v=20261019d"></script>
  <script defer src="js/FireTowerArtData.js?v=20261009o"></script>
  <script defer src="js/LavaBulletData.js?v=20261009l"></script>
  <script defer src="js/IceTowerArtData.js?v=20261010a"></script>
  <script defer src="js/IceBulletData.js?v=20261010a"></script>
  <script defer src="js/WaterTowerArtData.js?v=20261010f"></script>
  <script defer src="js/WaterBulletData.js?v=20261010c"></script>
  <script defer src="js/ThunderSheetData.js?v=20261015c"></script>
  <script defer src="js/WindTowersArtData.js?v=20261015c"></script>
  <script defer src="js/GravityTowersArtData.js?v=20261015c"></script>
  <!-- 敌人美术数据（BOSS 三只独立贴图 + 史莱姆静态降级贴图，data URI，离线生成） -->
  <script defer src="js/EnemyArtData.js?v=20261014a"></script>
  <!-- 死亡皇冠贴图（从三个 Boss 死亡视频末帧提取，data URI，离线生成） -->
  <script defer src="js/CrownArtData.js?v=20261015c"></script>
  <!-- 公主窗口图片（点击终点城堡大门弹出，整图缩放 data URI，离线生成） -->
  <script defer src="js/PrincessArtData.js?v=20261016a"></script>
  <script defer src="js/objects/FireBurn.js?v=20261009n"></script>
  <script defer src="js/objects/FireVideoPipeline.js?v=20261019a"></script>
  <script defer src="js/objects/SlimeVideo.js?v=20261018a"></script>
  <script defer src="js/objects/BossVideo.js?v=20261018a"></script>
  <script defer src="js/objects/WindVideo.js?v=20261018a"></script>
  <!-- 第 8 关小怪移动视频（水晶史莱姆 / 自爆泥怪，白底/绿幕抠图单例） -->
  <script defer src="js/objects/Level8Video.js?v=20261019b"></script>
  <script defer src="js/objects/Tower.js?v=20261019a"></script>
  <script defer src="js/objects/ThunderArc.js?v=20261012m"></script>
  <script defer src="js/scenes/BootScene.js?v=20261018a"></script>
  <script defer src="js/scenes/LevelSelectScene.js?v=20261018l"></script>
  <script defer src="js/scenes/GameScene.js?v=20261019e"></script>
  <script defer src="js/main.js?v=20261019a"></script>
  <script>
    /* 启动进度条 + 失败自动重试（放在所有 defer 脚本之后：
       本内联脚本在文档解析期同步执行，早于任何 defer 脚本执行，
       因此 load 监听一个都不会漏；defer 脚本每个加载+执行完毕
       都会触发自身 load 事件，进度条随之推进）。
       失败处理：sessionStorage 计数，自动刷新重试至多 2 次，
       仍失败则显示手动「重新加载」按钮，绝不静默卡死；
       启动成功后由 BootScene 清除计数（见 BootScene.create）。 */
    (function () {
      var RETRY_KEY = '__tdBootRetry', MAX_RETRY = 2;
      var fill = document.getElementById('boot-bar-fill');
      var tip = document.getElementById('boot-loading-tip');
      var btn = document.getElementById('boot-retry');
      var scripts = document.querySelectorAll('script[src]');
      var total = scripts.length, done = 0;
      /* 进度条分两段：脚本下载 0~60%，BootScene 本地贴图解码 60~100%
         （由 BootScene 回调 window.__tdArtProgress 推进），全程百分比可见 */
      var SCRIPT_W = 60, artPct = 0;
      function render() {
        var sp = total ? done / total : 0;
        var pct = Math.round(sp * SCRIPT_W + artPct * (100 - SCRIPT_W) / 100);
        if (fill) fill.style.width = pct + '%';
        if (tip && !window.__tdBootFailed && !window.__tdBootOK) {
          tip.textContent = '正在加载资源 ' + done + '/' + total + '（' + pct + '%）';
        }
      }
      /* BootScene：本地贴图解码进度（0~100）并入同一条进度条 */
      window.__tdArtProgress = function (d, t) {
        artPct = t ? Math.round(d / t * 100) : 100;
        var sp = total ? done / total : 1;
        var pct = Math.round(sp * SCRIPT_W + artPct * (100 - SCRIPT_W) / 100);
        if (fill) fill.style.width = pct + '%';
        if (tip && !window.__tdBootFailed && !window.__tdBootOK) {
          tip.textContent = '正在准备贴图 ' + d + '/' + (t || 0) + '（' + pct + '%）';
        }
      };
      /* 失败统一入口（由开头启动守护的 window error 捕获调用） */
      window.__tdBootOnFail = function () {
        var n = 0;
        try { n = parseInt(sessionStorage.getItem(RETRY_KEY) || '0', 10) || 0; } catch (e) {}
        if (n < MAX_RETRY) {
          try { sessionStorage.setItem(RETRY_KEY, String(n + 1)); } catch (e) {}
          if (tip) tip.textContent = '⚠ 资源加载失败，正在自动重试（第 ' + (n + 1) + '/' + MAX_RETRY + ' 次）…';
          /* 竞态防护：若游戏已奇迹般启动（失败的是非关键脚本），不再打断 */
          setTimeout(function () { if (!window.__tdBootOK) location.reload(); }, 1200);
        } else {
          if (tip) tip.textContent = '⚠ 资源加载失败，请检查网络后点击重试';
          if (btn) btn.style.display = '';
        }
      };
      Array.prototype.forEach.call(scripts, function (s) {
        s.addEventListener('load', function () { done++; render(); });
      });
      render();
      /* 极端情况：失败发生在本脚本注册前（如 phaser 秒断网）→ 补触发 */
      if (window.__tdBootFailed) window.__tdBootOnFail();
      if (btn) btn.addEventListener('click', function () {
        try { sessionStorage.setItem(RETRY_KEY, '0'); } catch (e) {}
        location.reload();
      });
    })();
  </script>
</body>
</html>
